        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - consumergroup"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "consume"
                is_allowed: true
              - type: "describe"
                is_allowed: true
            users:
              - "ssb"
        state: present

    - name: "Kafka Policy SSB Add: 'all - topic'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - topic"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "consume"
                is_allowed: true
              - type: "describe"
                is_allowed: true
            users:
              - "ssb"
        state: present

    - name: "Kafka Policy Create: 'SSB - Internal topics'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "SSB - Internal topics"
        service: "cm_kafka"
        service_type: "kafka"
        description: "SSB - Internal topics policy"
        resources:
          topic:
            values:
              - "__ssb*"
        state: present

    - name: "Kafka Policy Update: 'SSB - Internal topics'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "SSB - Internal topics"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "publish"
                is_allowed: true
              - type: "consume"
                is_allowed: true
              - type: "configure"
                is_allowed: true
              - type: "describe"
                is_allowed: true
              - type: "create"
                is_allowed: true
              - type: "delete"
                is_allowed: true
              - type: "describe_configs"
                is_allowed: true
              - type: "alter_configs"
                is_allowed: true
              - type: "alter"
                is_allowed: true
            users:
              - "ssb"
        state: present

    - name: "Kafka Policy Create: 'SSB - Internal consumer groups'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
