---


- name: Create FreeIPA users and groups for One Node Cluster
  hosts: freeipa
  gather_facts: yes
  become: yes
  vars:
    ipaadmin_principal: "admin"
    ipaadmin_password: "{{ common_password }}"
    ipaserver_host: "{{ inventory_hostname }}"
    ipa_groups_to_create:
      - name: "cdp-admins"
      - name: "cdp-users"
    superuser_accounts:
      - user: "user001"
        given_name: "user001"
        surname: "user001"
        display_name: "user001"
        password: "user001"
  tasks:
    - name: Create FreeIPA groups
      community.general.ipa_group:
        name: "{{ __group.name }}"
        ipa_pass: "{{ ipaadmin_password }}"
        ipa_user: "{{ ipaadmin_principal }}"
        ipa_host: "{{ ipaserver_host }}"
      loop: "{{ ipa_groups_to_create }}"
      loop_control:
        loop_var: __group
        label: "{{ __group.name }}"

    - name: Create users for cdp-users
      community.general.ipa_user:
        displayname: "{{ __su.display_name | default(omit) }}"
        givenname: "{{ __su.given_name }}"
        name: "{{ __su.user }}"
        sn: "{{ __su.surname }}"
        password: "{{ __su.password }}"
        update_password: on_create
        ipa_pass: "{{ ipaadmin_password }}"
        ipa_user: "{{ ipaadmin_principal }}"
        ipa_host: "{{ ipaserver_host }}"
      loop: "{{ superuser_accounts }}"
      loop_control:
        loop_var: __su
        label:  "{{ __su.user }}"

    - name: Set password expiration far in the future for cdp-users
      community.general.ipa_user:
        name: "{{ __su.user }}"
        krbpasswordexpiration: "20991231235959"
        ipa_pass: "{{ ipaadmin_password }}"
        ipa_user: "{{ ipaadmin_principal }}"
        ipa_host: "{{ ipaserver_host }}"
      loop: "{{ superuser_accounts }}"
      loop_control:
        loop_var: __su
        label: "{{ __su.user }}"

    - name: Add participant users to FreeIPA group
      community.general.ipa_group:
        name: "cdp-users"
        user: "{{ superuser_accounts | map(attribute='user') | list }}"
        append: true
        ipa_pass: "{{ ipaadmin_password }}"
        ipa_user: "{{ ipaadmin_principal }}"
        ipa_host: "{{ ipaserver_host }}"

    - name: Add admin user to cdp-admins group
      community.general.ipa_group:
        name: "cdp-admins"
        user: "{{ ipaadmin_principal }}"
        append: true
        ipa_pass: "{{ ipaadmin_password }}"
        ipa_user: "{{ ipaadmin_principal }}"
        ipa_host: "{{ ipaserver_host }}"

- name: Update/Create ranger policies
  hosts: localhost
  connection: local
  gather_facts: no
  tags: ranger
  vars:
    ranger_api_endpoint: "https://knox.{{ groups['reverse_proxy'] | map('extract', hostvars, 'ansible_host') | first }}.{{ public_domain }}:443/gateway/cdp-proxy-api/ranger"
    ranger_username: "admin"
    ranger_password: "{{ common_password }}"
    cluster_name: "OneNodeCluster"
    validate_certs: false
    groups_to_add: "cdp-admins"
  tasks:
    # ============================================================================
    # KAFKA POLICIES
    # ============================================================================

    - name: "Kafka Policy Update: 'all - consumergroup'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - consumergroup"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "consume"
                is_allowed: true
              - type: "describe"
                is_allowed: true
              - type: "delete"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present

    - name: "Kafka Policy Update: 'all - topic'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - topic"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "publish"
                is_allowed: true
              - type: "consume"
                is_allowed: true
              - type: "configure"
                is_allowed: true
              - type: "describe"
                is_allowed: true
              - type: "create"
                is_allowed: true
              - type: "delete"
                is_allowed: true
              - type: "describe_configs"
                is_allowed: true
              - type: "alter_configs"
                is_allowed: true
              - type: "alter"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present

    - name: "Kafka Policy Update: 'all - transactionalid'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - transactionalid"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "publish"
                is_allowed: true
              - type: "describe"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present

    - name: "Kafka Policy Update: 'all - cluster'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - cluster"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "configure"
                is_allowed: true
              - type: "describe"
                is_allowed: true
              - type: "kafka_admin"
                is_allowed: true
              - type: "create"
                is_allowed: true
              - type: "idempotent_write"
                is_allowed: true
              - type: "describe_configs"
                is_allowed: true
              - type: "alter_configs"
                is_allowed: true
              - type: "cluster_action"
                is_allowed: true
              - type: "alter"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present

    - name: "Kafka Policy Update: 'all - delegationtoken'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "all - delegationtoken"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "describe"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present

    - name: "Kafka Policy Update: 'ATLAS_HOOK'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "ATLAS_HOOK"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "publish"
                is_allowed: true
            groups:
              - "{{ groups_to_add }}"
        state: present


    # ============================================================================
    # KAKFA-SSB POLICIES
    # ============================================================================

    # SSB (Streaming SQL Engine) permissions - temporary until CSA-1470 is resolved
