        service: "cm_kafka"
        service_type: "kafka"
        description: "SSB - Internal consumer groups policy"
        resources:
          consumergroup:
            values:
              - "__ssb*"
        state: present

    - name: "Kafka Policy Update: 'SSB - Internal consumer groups'"
      cloudera.runtime.ranger_policy:
        url: "{{ ranger_api_endpoint }}"
        url_username: "{{ ranger_username }}"
        url_password: "{{ ranger_password }}"
        validate_certs: "{{ validate_certs }}"
        name: "SSB - Internal consumer groups"
        service: "cm_kafka"
        merged: true
        access_policies:
          - accesses:
              - type: "publish"
                is_allowed: true
              - type: "consume"
                is_allowed: true
              - type: "describe"
                is_allowed: true
              - type: "delete"
                is_allowed: true
            users:
              - "ssb"
        state: present





